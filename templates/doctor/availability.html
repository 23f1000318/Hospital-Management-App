{% extends "base.html" %}

{% block title %}Manage Availability{% endblock %}

{% block content %}
<h2>Manage My Availability</h2>

<div class="card mt-4">
    <div class="card-body">
        <form method="POST" action="{{ url_for('doctor_availability') }}">
            <p class="text-muted">Set your availability for the next 7 days</p>
            
            {% for date in next_7_days %}
            <div class="card mb-3">
                <div class="card-header">
                    {{ date.strftime('%A, %B %d, %Y') }}
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <input type="hidden" name="date_{{ loop.index0 }}" value="{{ date }}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="available_{{ loop.index0 }}" 
                                       id="available_{{ loop.index0 }}"
                                       {% if availability_dict.get(date) %}checked{% endif %}>
                                <label class="form-check-label" for="available_{{ loop.index0 }}">
                                    Available
                                </label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="start_time_{{ loop.index0 }}" class="form-label">Start Time</label>
                            <input type="time" class="form-control" name="start_time_{{ loop.index0 }}" 
                                   id="start_time_{{ loop.index0 }}"
                                   value="{{ availability_dict.get(date).start_time if availability_dict.get(date) else '09:00' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="end_time_{{ loop.index0 }}" class="form-label">End Time</label>
                            <input type="time" class="form-control" name="end_time_{{ loop.index0 }}" 
                                   id="end_time_{{ loop.index0 }}"
                                   value="{{ availability_dict.get(date).end_time if availability_dict.get(date) else '17:00' }}">
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{{ url_for('doctor_dashboard') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Availability</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
