{% extends "base.html" %}

{% block title %}Complete Appointment{% endblock %}

{% block content %}
<h2>Complete Appointment</h2>

<div class="card mt-4">
    <div class="card-body">
        <h5>Appointment Details</h5>
        <p><strong>Patient:</strong> {{ appointment.patient.name }}</p>
        <p><strong>Date:</strong> {{ appointment.date }}</p>
        <p><strong>Time:</strong> {{ appointment.time }}</p>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header">
        <h5>Treatment Details</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('doctor_complete_appointment', id=appointment.id) }}">
            <div class="mb-3">
                <label for="diagnosis" class="form-label">Diagnosis</label>
                <textarea class="form-control" id="diagnosis" name="diagnosis" rows="3" 
                          placeholder="Enter diagnosis details" required></textarea>
            </div>
            <div class="mb-3">
                <label for="prescription" class="form-label">Prescription</label>
                <textarea class="form-control" id="prescription" name="prescription" rows="3" 
                          placeholder="Enter prescribed medications" required></textarea>
            </div>
            <div class="mb-3">
                <label for="notes" class="form-label">Additional Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3" 
                          placeholder="Any additional notes or instructions"></textarea>
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{{ url_for('doctor_appointments') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-success">Complete Appointment</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
